name: Sync Notion Blog

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *' # Авто-проверка каждый день
  workflow_dispatch: # Кнопка ручного запуска

permissions:
  contents: write

jobs:
  sync-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install @notionhq/client@2.2.0 notion-to-md@3.1.5

      - name: Pull Latest Changes from Repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull origin ${GITHUB_REF_NAME} --rebase || git rebase --abort || true

      - name: Build Blog Pages from Notion
        env:
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node build-blog.js

      - name: Commit and Push Changes to GitHub
        run: |
          git add -f blog.html blog/ assets/images/blog/
          git status
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update blog from Notion"
            git push origin ${GITHUB_REF_NAME}
          fi
